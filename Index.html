<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Love Tree of MI Doe 💜💙</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #d7c2a3;
            --bg-2: #e7d7c1;
            --bg-3: #f5ece1;
            --lavender: #BA55D3;
            --sky-blue: #87CEFA;
            --brown: #5D4037;
            --glass: rgba(255, 255, 255, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 50%, var(--bg-1) 100%);
            color: var(--brown);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Magical Background Effects --- */
        #particle-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating {
            position: absolute;
            animation: floatUp linear forwards;
            filter: drop-shadow(0 0 5px white);
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-top: 5vh;
            z-index: 10;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: var(--lavender);
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 1rem;
            font-weight: 300;
            margin: 5px 0;
            letter-spacing: 2px;
            color: var(--brown);
        }

        /* --- Garden & Growth --- */
        #garden {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        #stage-element {
            font-size: 100px;
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
            user-select: none;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
        }

        .tree-mode {
            font-size: 220px !important;
            filter: drop-shadow(0 0 30px var(--lavender)) !important;
            animation: treeGlow 3s infinite alternate;
        }

        @keyframes treeGlow {
            from { filter: drop-shadow(0 0 20px var(--lavender)); }
            to { filter: drop-shadow(0 0 40px var(--sky-blue)); }
        }

        .message-box {
            height: 50px;
            margin: 20px;
            text-align: center;
            font-style: italic;
            color: #7B1FA2;
            padding: 0 30px;
            font-weight: 500;
            max-width: 80%;
        }

        /* --- Hanging Fruits --- */
        #fruit-container {
            position: absolute;
            width: 300px;
            height: 300px;
            pointer-events: none;
            display: none;
        }

        .hanging-item {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
            animation: sway 4s ease-in-out infinite;
            pointer-events: auto;
        }

        .vine {
            width: 2px;
            background: linear-gradient(to bottom, #4A3728, #6B8E23);
            box-shadow: 0 0 3px rgba(0,0,0,0.2);
        }

        .fruit {
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 8px gold);
        }

        .fruit:hover { transform: scale(1.3); }

        @keyframes sway {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }

        /* --- UI Controls --- */
        .water-btn {
            background: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            color: var(--lavender);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .water-btn:active { transform: scale(0.9); }

        /* --- Glassmorphism Modal --- */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 25px;
            border-radius: 30px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-content img {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #eee;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- Music Player --- */
        .music-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .music-player button {
            background: var(--lavender);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }

        #volume-slider {
            width: 60px;
            accent-color: var(--lavender);
        }

        /* --- Final Ending --- */
        #final-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-3);
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .letter {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            line-height: 1.6;
            color: var(--brown);
            white-space: pre-line;
            opacity: 0;
        }

        .final-heart {
            font-size: 80px;
            margin-top: 20px;
            animation: pulse 2s infinite;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .final-heart span {
            position: absolute;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            color: white;
            font-weight: bold;
            width: 100px;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="particle-container"></div>

    <header id="header">
        <h1>Good Morning, MI Doe 💜</h1>
        <h2>From MI Deer 🌷</h2>
    </header>

    <div id="garden">
        <div id="message" class="message-box">Wait for the love to grow...</div>
        <div id="stage-element">🌱</div>
        
        <div id="fruit-container">
            <!-- Fruits generated by JS -->
        </div>
    </div>

    <button id="water-btn" class="water-btn">💧 Water The Flower</button>

    <!-- Music Player -->
    <div class="music-player">
        <button id="play-btn">▶</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        <audio id="bg-music" loop>
            <source src="Justin Bieber - DAISIES.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Modal -->
    <div id="modal-overlay">
        <div class="modal-content">
            <img id="modal-img" src="" alt="Memory">
            <p id="modal-text" style="font-weight: 500;"></p>
            <button onclick="closeModal()" style="border:none; background:var(--sky-blue); color:white; padding:8px 20px; border-radius:15px; cursor:pointer;">Close 🌸</button>
        </div>
    </div>

    <!-- Final Surprise -->
    <div id="final-screen">
        <div class="letter" id="letter-content"></div>
        <div class="final-heart" id="final-heart-icon" style="display:none;">
            💜
            <span>Forever Us 💜💙</span>
        </div>
    </div>

    <script>
        // --- Data ---
        const stages = ['🌱', '🌿', '🌷', '🌸', '🌳'];
        const growthMessages = [
            "Every flower needs a little love 🌷",
            "You make my world brighter ☀️",
            "Thank you for being you 💕",
            "My favorite place is beside you ❤️",
            "MI Deer loves MI Deo 🥰",
            "I hope today makes you smile 🌸"
        ];

        const memories = [
    { img: 'photo1.jpg', text: "I love you, Just the way you are ❤️" },
    { img: 'photo2.jpg', text: "You always make my day brighter ☀️" },
    { img: 'photo3.jpg', text: "Tagotago man ang Lo-love ey 🥰" },
    { img: 'photo4.jpg', text: "You have the prettiest smile ❤️" },
    { img: 'photo5.jpg', text: "A memory I never want to forget 🌸" },
    { img: 'photo6.jpg', text: "Thank you for being you 💕" },
    { img: 'photo7.jpg', text: "I'd choose you again and again 💜" }
];

        // --- State ---
        let currentStage = 0;
        let fruitsClicked = 0;
        let isTreeGrown = false;

        // --- Elements ---
        const waterBtn = document.getElementById('water-btn');
        const stageElem = document.getElementById('stage-element');
        const messageBox = document.getElementById('message');
        const fruitContainer = document.getElementById('fruit-container');
        const bgMusic = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const volumeSlider = document.getElementById('volume-slider');

        // --- Initialization ---
        function init() {
            startParticleSystem();
            messageBox.innerText = growthMessages[0];
        }

        // --- Particle System ---
        function startParticleSystem() {
            const container = document.getElementById('particle-container');
            const items = ['💜', '💙', '✨', '⭐'];
            
            setInterval(() => {
                const p = document.createElement('div');
                p.className = 'floating';
                p.innerText = items[Math.floor(Math.random() * items.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.fontSize = (Math.random() * 15 + 15) + 'px';
                p.style.animationDuration = (Math.random() * 3 + 4) + 's';
                container.appendChild(p);
                
                setTimeout(() => p.remove(), 7000);
            }, 600);
        }

        // --- Growth Logic ---
        waterBtn.addEventListener('click', () => {
            // Music starts on first interaction
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Music blocked"));
                playBtn.innerText = "⏸";
            }

            if (currentStage < stages.length - 1) {
                currentStage++;
                stageElem.innerText = stages[currentStage];
                messageBox.innerText = growthMessages[currentStage] || growthMessages[0];
                
                // Animation trigger
                stageElem.style.transform = "scale(1.3)";
                setTimeout(() => stageElem.style.transform = "scale(1)", 300);

                if (currentStage === stages.length - 1) {
                    growTree();
                }
            }
        });

        function growTree() {
            isTreeGrown = true;
            stageElem.classList.add('tree-mode');
            waterBtn.style.display = 'none';
            messageBox.innerText = "The Love Tree has bloomed! Explore the magical fruits ✨";
            
            setTimeout(() => {
                fruitContainer.style.display = 'block';
                spawnFruits();
            }, 1000);
        }

        // --- Hanging Fruits System ---
        function spawnFruits() {
            const icons = ['💜', '💙', '✨', '⭐', '💜', '💙', '✨'];
            // Coordinates relative to the center of the tree canopy
            const positions = [
    {x: 50, y: 10, h: 50},
    {x: 20, y: 30, h: 70},
    {x: 80, y: 30, h: 40},
    {x: 35, y: 55, h: 60},
    {x: 65, y: 55, h: 80},
    {x: 10, y: 60, h: 45},
    {x: 90, y: 65, h: 55}
];

            positions.forEach((pos, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'hanging-item';
                wrapper.style.left = pos.x + '%';
                wrapper.style.top = pos.y + '%';
                wrapper.style.animationDelay = (Math.random() * 2) + 's';

                const vine = document.createElement('div');
                vine.className = 'vine';
                vine.style.height = pos.h + 'px';

                const fruit = document.createElement('div');
                fruit.className = 'fruit';
                fruit.innerText = icons[i];
                fruit.onclick = () => openMemory(i);

                wrapper.appendChild(vine);
                wrapper.appendChild(fruit);
                fruitContainer.appendChild(wrapper);
            });
        }

        // --- Memory Modal ---
        function openMemory(index) {
            const data = memories[index];
            document.getElementById('modal-img').src = data.img;
            document.getElementById('modal-text').innerText = data.text;
            document.getElementById('modal-overlay').style.display = 'flex';
            
            // Mark as clicked if not already
            if (!memories[index].clicked) {
                memories[index].clicked = true;
                fruitsClicked++;
                checkFinale();
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // --- Music System ---
        playBtn.onclick = () => {
            if (bgMusic.paused) {
                bgMusic.play();
                playBtn.innerText = "⏸";
            } else {
                bgMusic.pause();
                playBtn.innerText = "▶";
            }
        };

        volumeSlider.oninput = (e) => {
            bgMusic.volume = e.target.value;
        };

        // --- Finale ---
        function checkFinale() {
            if (fruitsClicked >= 7) {
                setTimeout(triggerFinale, 1500);
            }
        }

        function triggerFinale() {
            const finalScreen = document.getElementById('final-screen');
            const letterBox = document.getElementById('letter-content');
            finalScreen.style.display = 'flex';
            
            const message = `MI Doe,

No matter what kind of day you have,
I hope you remember that you are loved,
appreciated,
and cherished more than words can say.

Thank you for being part of my life.

Love,
MI Deer ❤️`;

            // Typewriter effect
            let charIndex = 0;
            finalScreen.style.opacity = 0;
            let opac = 0;
            
            const fadeIn = setInterval(() => {
                opac += 0.05;
                finalScreen.style.opacity = opac;
                if (opac >= 1) clearInterval(fadeIn);
            }, 50);

            function typeWriter() {
                if (charIndex < message.length) {
                    letterBox.innerHTML += message.charAt(charIndex);
                    letterBox.style.opacity = 1;
                    charIndex++;
                    setTimeout(typeWriter, 70);
                } else {
                    document.getElementById('final-heart-icon').style.display = 'flex';
                    createRainEffect();
                }
            }
            
            setTimeout(typeWriter, 1000);
        }

        function createRainEffect() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerText = '💜';
                heart.style.position = 'fixed';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-50px';
                heart.style.fontSize = '30px';
                heart.style.zIndex = '3000';
                heart.style.transition = 'transform 3s linear, top 3s linear';
                document.body.appendChild(heart);
                
                setTimeout(() => {
                    heart.style.top = '110vh';
                    heart.style.transform = `translateX(${Math.random()*100 - 50}px) rotate(360deg)`;
                }, 100);
                
                setTimeout(() => heart.remove(), 4000);
            }, 200);
        }

        init();
    </script>
</body>
</html>
